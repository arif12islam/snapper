name: Release

# Builds Snapper on a Mac runner, signs it with the project's certificate and publishes a GitHub release
# containing Snapper-<version>.dmg (drag-to-Applications installer, also what in-app updates download) and a .zip.
# Raise the version in build.sh (CFBundleShortVersionString) and push to main to publish a new release.
#
# One-time setup: run ./setup-signing.sh on your Mac and add the two secrets it prints
# (SIGNING_CERT_P12_BASE64 and SIGNING_CERT_PASSWORD) under Settings > Secrets and variables > Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          P12: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::No SIGNING_CERT_P12_BASE64 secret, so this build is only ad-hoc signed. Run ./setup-signing.sh and add the secrets."
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/identity.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Build
        run: |
          set +e
          ./build.sh --release 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          # Surface compiler errors as annotations, so they are readable without the raw log.
          grep -E "error:" build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          exit $status

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Snapper.app/Contents/Info.plist)"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; raise the version in build.sh to publish a new one."
          else
            gh release create "$VERSION" "build/Snapper-$VERSION.dmg" "build/Snapper-$VERSION.zip" "build/Snapper-$VERSION.pkg" \
              --title "Snapper $VERSION" --notes "Snapper $VERSION"
          fi
